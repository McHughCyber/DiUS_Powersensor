name: Publish

on:
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  release_zip_file:
    name: Publish zip file asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.x"

      - name: Get version
        id: version
        uses: home-assistant/actions/helpers/version@f6f29a7ee3fa0eccadf3620a7b9ee00ab54ec03b

      - name: Set version number
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            MANIFEST_VERSION="${TAG#v}"
            python3 "${{ github.workspace }}/manage/update_manifest.py" --version "$MANIFEST_VERSION"
          else
            python3 "${{ github.workspace }}/manage/update_manifest.py" --version "${{ steps.version.outputs.version }}"
          fi

      - name: Verify tag matches manifest (release)
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG_VERSION_NUM="${TAG#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/dius/manifest.json'))['version'])")
          if [ "$TAG_VERSION_NUM" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version mismatch between tag and manifest"
            echo "Tag (without v): $TAG_VERSION_NUM"
            echo "Manifest: $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version consistency verified: $MANIFEST_VERSION"

      - name: Verify hacs.json and resolve release asset name (release)
        if: github.event_name == 'release'
        id: hacs_release
        run: |
          if [ ! -f "hacs.json" ]; then
            echo "::error::hacs.json not found"
            exit 1
          fi
          FILENAME=$(python3 -c "import json; print(json.load(open('hacs.json'))['filename'])")
          if [ "$FILENAME" != "dius.zip" ]; then
            echo "::error::hacs.json filename must be dius.zip for zip_release (got: $FILENAME)"
            exit 1
          fi
          echo "hacs.json filename ok: $FILENAME"
          echo "zip_filename=$FILENAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=${{ github.workspace }}/$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Detect existing HACS release asset
        id: release_asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT: ${{ steps.hacs_release.outputs.zip_filename }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[].name' | grep -qxF "$EXPECT"; then
            echo "skip_zip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${TAG} already has ${EXPECT}; skipping zip build and upload."
          else
            echo "skip_zip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload zip to action
        uses: actions/upload-artifact@v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          name: dius_powersensor
          path: ${{ github.workspace }}/custom_components/dius

      - name: Build release zip (HACS asset filename)
        if: ${{ github.event_name == 'release' && steps.release_asset.outputs.skip_zip != 'true' }}
        env:
          ZIP_PATH: ${{ steps.hacs_release.outputs.zip_path }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/custom_components/dius"
          rm -f "$ZIP_PATH"
          zip -r "$ZIP_PATH" ./
          test -f "$ZIP_PATH"

      - name: Upload zip to release
        uses: softprops/action-gh-release@v3
        if: ${{ github.event_name == 'release' && steps.release_asset.outputs.skip_zip != 'true' }}
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ steps.hacs_release.outputs.zip_path }}

      - name: Verify release asset on GitHub
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_ASSET: ${{ steps.hacs_release.outputs.zip_filename }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          assets=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[].name')
          echo "$assets" | grep -qxF "$EXPECT_ASSET" || {
            echo "::error::Release ${TAG} has no ${EXPECT_ASSET} asset"
            echo "Assets:"
            echo "$assets"
            exit 1
          }
          echo "Verified ${EXPECT_ASSET} on release ${TAG}"

      - name: Validate HACS requirements
        if: github.event_name == 'release'
        uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands
