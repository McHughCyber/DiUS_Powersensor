name: Dependabot auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_run:
    workflows:
      - Linting
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge-setup:
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq '.allow_auto_merge')" = "true" ]; then
            gh pr merge --auto --squash "$PR_URL"
          else
            echo "Auto-merge is not enabled for this repository; merge will run after CI succeeds."
          fi

  automerge-after-ci:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_DATA=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0]')
          if [ -z "$PR_DATA" ] || [ "$PR_DATA" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ACTOR=$(echo "$PR_DATA" | jq -r '.user.login')
          if [ "$ACTOR" != "dependabot[bot]" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$(echo "$PR_DATA" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$PR_DATA" | jq -r '.html_url')" >> "$GITHUB_OUTPUT"

      - name: Fetch Dependabot metadata
        if: steps.pr.outputs.skip != 'true'
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-sha: ${{ github.event.workflow_run.head_sha }}

      - name: Squash merge Dependabot PR after CI
        if: |
          steps.pr.outputs.skip != 'true' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq '.allow_auto_merge')" = "true" ]; then
            echo "Auto-merge is enabled; skipping direct merge."
            exit 0
          fi
          gh pr view "$PR_URL" --json state,merged --jq '.state,.merged' | grep -qx MERGED && exit 0 || true
          gh pr merge "$PR_URL" --squash
