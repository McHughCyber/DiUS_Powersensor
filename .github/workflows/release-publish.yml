name: Release Publish

on:
  release:
    types:
      - published

env:
  DEFAULT_PYTHON: "3.12"

jobs:
  validate:
    name: Validate published release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Validate release metadata
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tags must use v-prefixed semver, such as v1.2.3"
            exit 1
          fi

          VERSION_NUM="${VERSION#v}"
          python3 - <<PY
          import json
          from pathlib import Path

          version = "${VERSION_NUM}"
          manifest = json.loads(Path("custom_components/dius/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())

          if manifest.get("version") != version:
              raise SystemExit(
                  f"Version mismatch: tag {version}, manifest {manifest.get('version')}"
              )

          if hacs.get("zip_release") is not True or hacs.get("filename") != "dius.zip":
              raise SystemExit("hacs.json must publish dius.zip as a zip release")

          print(f"Validated release metadata for {version}")
          PY

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Install test requirements
        run: |
          pip install "$(grep '^uv' < requirements_dev.txt)"
          uv pip install -r requirements_test.txt --system --prerelease=allow

      - name: Run Home Assistant test suite
        run: |
          pytest \
            --timeout=15 \
            --durations=10 \
            -n auto \
            -rA \
            -p no:sugar \
            tests

  publish_zip:
    name: Publish HACS zip
    runs-on: ubuntu-latest
    needs:
      - validate
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build dius.zip
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/dius")
          target = Path(os.environ["RUNNER_TEMP"]) / "dius.zip"

          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if not path.is_file():
                      continue
                  if "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  archive.write(path, path.relative_to(source))

          with ZipFile(target) as archive:
              failed = archive.testzip()
              if failed is not None:
                  raise SystemExit(f"Invalid zip member: {failed}")

          print(f"Built {target}")
          PY

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dius.zip

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.event.release.tag_name }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | grep -Fx "dius.zip"
