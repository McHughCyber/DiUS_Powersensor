name: Promote Staging to Master

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to promote, e.g. v1.2.3"
        required: false
        type: string

jobs:
  create_promotion_pr:
    name: Create promotion PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create staging to master pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          EXISTING_PR="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base master \
            --head staging \
            --state open \
            --json number \
            --jq '.[0].number // ""')"

          if [ -n "${EXISTING_PR}" ]; then
            echo "Promotion PR already exists: #${EXISTING_PR}"
            exit 0
          fi

          TITLE="Promote staging to master"
          if [ -n "${VERSION}" ]; then
            TITLE="${TITLE} for ${VERSION}"
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base master \
            --head staging \
            --title "${TITLE}" \
            --body "Promotes the validated staging branch to master for publication."
