name: Release Validate

on:
  release:
    types:
      - created
      - edited
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Version to validate, e.g. v1.2.3 or 1.2.3"
        required: true
        type: string

env:
  DEFAULT_PYTHON: "3.12"

jobs:
  validate_release:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}

      - name: Validate version and HACS metadata
        id: validate
        run: |
          VERSION="${{ github.event.release.tag_name || github.event.inputs.version }}"
          if [[ ! "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: ${VERSION}"
            echo "Expected format: v1.2.3 or v1.2.3-beta.1"
            exit 1
          fi

          VERSION_NUM="${VERSION#v}"
          python3 - <<PY
          import json
          from pathlib import Path

          version = "${VERSION_NUM}"
          manifest = json.loads(Path("custom_components/dius/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())

          if manifest.get("version") != version:
              raise SystemExit(
                  f"Version mismatch: tag/input {version}, manifest {manifest.get('version')}"
              )

          if hacs.get("zip_release") is not True:
              raise SystemExit("hacs.json must set zip_release to true")

          if hacs.get("filename") != "dius.zip":
              raise SystemExit("hacs.json filename must be dius.zip")

          print(f"Validated release metadata for {version}")
          PY

      - name: HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
          ignore: brands

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Install test requirements
        run: |
          pip install "$(grep '^uv' < requirements_dev.txt)"
          uv pip install -r requirements_test.txt --system --prerelease=allow

      - name: Run Home Assistant test suite
        run: |
          pytest \
            --timeout=15 \
            --durations=10 \
            -n auto \
            -rA \
            -p no:sugar \
            tests

      - name: Build and inspect release zip
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("custom_components/dius")
          target = Path(os.environ["RUNNER_TEMP"]) / "dius.zip"

          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if not path.is_file():
                      continue
                  if "__pycache__" in path.parts or path.suffix == ".pyc":
                      continue
                  archive.write(path, path.relative_to(source))

          with ZipFile(target) as archive:
              failed = archive.testzip()
              if failed is not None:
                  raise SystemExit(f"Invalid zip member: {failed}")

          print(f"Built {target}")
          PY
